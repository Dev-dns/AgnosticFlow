name: agnosticflow

services:

  n8n:
    image: docker.n8n.io/n8nio/n8n:stable
    restart: unless-stopped

    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"

    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}

      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"

      GENERIC_TIMEZONE: Europe/Madrid
      TZ: Europe/Madrid

    volumes:
      - n8n_data:/home/node/.n8n

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - agnosticflow_network

  postgres:
    image: postgres:18
    restart: unless-stopped

    ports:
      - "127.0.0.1:5434:5432"

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data

    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Los scripts solo se ejecutan cuando el volumen de datos está vacío
      - ./database/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      # Por TCP: el servidor temporal de la inicialización solo escucha por
      # socket, así que no está "healthy" hasta que terminan los scripts
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - agnosticflow_network

networks:
  agnosticflow_network:
    driver: bridge

volumes:
  n8n_data:
  postgres_data:
